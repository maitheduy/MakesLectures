<html lang="vi">
<head>

    <style>
        :root {
            --bg: #f8fafc;
            --sidebar-bg: #ffffff;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-secondary: #64748b;
            --accent: #2563eb;
            --accent-light: #eff6ff;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            padding: 24px 0;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            transition: transform 0.3s ease;
            z-index: 100;
        }

        .logo {
            padding: 0 24px 24px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 16px;
        }
        .logo h2 { font-size: 18px; color: var(--accent); display: flex; align-items: center; gap: 8px; }
        .logo p { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

        .nav-item {
            padding: 10px 24px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: var(--text-secondary);
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }
        .nav-item:hover { background: var(--accent-light); color: var(--accent); }
        .nav-item.active {
            background: var(--accent-light);
            color: var(--accent);
            font-weight: 600;
            border-left-color: var(--accent);
        }
        .nav-count {
            background: var(--border);
            color: var(--text-secondary);
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: 500;
        }
        .nav-item.active .nav-count { background: var(--accent); color: white; }

        /* Main Content */
        .main {
            flex: 1;
            margin-left: 280px;
            padding: 32px;
            max-width: 100%;
        }

        .header {
            margin-bottom: 32px;
        }
        .header h1 { font-size: 28px; margin-bottom: 8px; }
        .header p { color: var(--text-secondary); margin-bottom: 24px; }

        .search-box {
            position: relative;
            max-width: 600px;
        }
        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            background: var(--card-bg);
            transition: all 0.2s;
        }
        .search-box input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        .stats {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            font-size: 14px;
            color: var(--text-secondary);
        }
        .stats span { font-weight: 600; color: var(--text); }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
            border-color: var(--accent);
        }
        .card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--accent);
            opacity: 0;
            transition: opacity 0.2s;
        }
        .card:hover::before { opacity: 1; }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .cmd {
            font-family: "Fira Code", Consolas, monospace;
            background: var(--accent-light);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
        }
        .card-id {
            font-size: 12px;
            color: var(--text-secondary);
            background: var(--bg);
            padding: 2px 8px;
            border-radius: 4px;
        }
        .card-desc {
            font-size: 14px;
            color: var(--text);
            line-height: 1.6;
        }
        .card-cat {
            margin-top: 12px;
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #10b981;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
            font-weight: 500;
        }
        .toast.show { transform: translateY(0); opacity: 1; }

        /* Mobile */
        .menu-toggle {
            display: none;
            position: fixed;
            top: 16px; left: 16px;
            background: var(--accent);
            color: white;
            border: none;
            width: 40px; height: 40px;
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer;
            z-index: 101;
        }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); box-shadow: 0 0 20px rgba(0,0,0,0.1); }
            .main { margin-left: 0; padding: 24px 16px; padding-top: 70px; }
            .menu-toggle { display: block; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

    const CATS = {
        0: { name: "Tất cả lệnh", icon: "📚" },
        1: { name: "Trình bày tri thức", icon: "🎨" },
        2: { name: "Tư duy và lập luận", icon: "🧠" },
        3: { name: "Thiết kế bài giảng", icon: "📝" },
        4: { name: "Kiểm tra và đánh giá", icon: "✅" },
        5: { name: "Cá nhân hóa học tập", icon: "🎯" },
        6: { name: "LIS và dòng chảy tri thức", icon: "🌊" },
        7: { name: "STEM, lập trình và mô phỏng", icon: "💻" },
        8: { name: "Chương trình và học liệu", icon: "📖" },
        9: { name: "Giáo dục nghề nghiệp & ĐH", icon: "🎓" },
        10: { name: "AI Agent và quản trị", icon: "🤖" }
    };

    let currentCat = 0;
    let searchTerm = "";

    function renderCategories() {
        const list = document.getElementById('categoryList');
        list.innerHTML = '';
        for (let i = 0; i <= 10; i++) {
            const count = i === 0 ? 250 : D.filter(d => d[3] === i).length;
            const div = document.createElement('div');
            div.className = `nav-item ${currentCat === i ? 'active' : ''}`;
            div.innerHTML = `<span>${CATS[i].icon} ${CATS[i].name}</span><span class="nav-count">${count}</span>`;
            div.onclick = () => { currentCat = i; render(); document.querySelector('.sidebar').classList.remove('open'); };
            list.appendChild(div);
        }
    }

    function renderCommands() {
        const grid = document.getElementById('commandGrid');
        const filtered = D.filter(d => {
            const matchCat = currentCat === 0 || d[3] === currentCat;
            const matchSearch = searchTerm === "" || 
                                d[1].toLowerCase().includes(searchTerm) || 
                                d[2].toLowerCase().includes(searchTerm);
            return matchCat && matchSearch;
        });

        document.getElementById('filteredCount').innerText = filtered.length;
        grid.innerHTML = '';

        if (filtered.length === 0) {
            grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:var(--text-secondary); padding:40px;">Không tìm thấy lệnh phù hợp.</p>';
            return;
        }

        filtered.forEach(d => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-header">
                    <span class="cmd">${d[1]}</span>
                    <span class="card-id">#${d[0]}</span>
                </div>
                <div class="card-desc">${d[2]}</div>
                <div class="card-cat">${CATS[d[3]].icon} ${CATS[d[3]].name}</div>
            `;
            card.onclick = () => {
                navigator.clipboard.writeText(d[1]).then(() => {
                    const toast = document.getElementById('toast');
                    toast.classList.add('show');
                    setTimeout(() => toast.classList.remove('show'), 2000);
                });
            };
            grid.appendChild(card);
        });
    }

    function render() {
        renderCategories();
        renderCommands();
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
        searchTerm = e.target.value.toLowerCase().trim();
        renderCommands();
    });

    // Init
    render();
</script>
